# ORACLE-Voz emergency rules. Text is normalized before matching: lowercase, accents removed, repeated spaces collapsed.
# Any match => emergency => show "Llama al 911" screen, alert the institution, stop the conversation.
# Must be reviewed by a health professional before real use.

emergency_number: "911"
user_message: "Esto puede ser una emergencia. Llama al 911 ahora."
institution_alert_level: critical
# Shown on the emergency screen together with 911 when the self_harm rule matched.
# Verified 2026-11-21 on the official CONASAMA page (Secretaría de Salud): free, 24 h, 365 days.
# https://www.gob.mx/conasama/articulos/linea-de-la-vida-800-911-2000
support_lines:
  self_harm:
    name: "Línea de la Vida"
    phone: "800 911 2000"
    tel: "8009112000"
    source: "https://www.gob.mx/conasama/articulos/linea-de-la-vida-800-911-2000"

categories:
  severe_breathing:
    label_es: Dificultad grave para respirar
    patterns:
      - "no (puedo|puede|podia|podemos) respirar"
      - "no le entra (el )?aire"
      - "se (me|le) (va|fue|esta yendo) el aire"
      - "ahogando"
      - "(me|le) falta (mucho )?el aire"
      - "no (puedo|puede) resollar"
      - "(labios|cara|unas) (morad|azul)"
      - "poniendo morad"
      # added 2026-11-21 after the external-set evaluation (voice/eval/proposed_rules.yaml)
      - "no (jala|le llega|me llega|le entra nada de) (el )?aire"
      - "no le entra.{0,12}aire"
      - "asfixi"
      - "boquea"
      - "respira (bien |muy )?(feo|raro|silbando)"
      - "(se puso|esta|se esta poniendo) (gris|morad|azul)"
      - "labios.{0,15}morad"
  chest_pain:
    label_es: Dolor fuerte en el pecho
    patterns:
      - "(duele|dolia|dolor|aprieta|oprime|opresion)\\b.{0,25}\\bpecho"
      - "dolor que (baja|se va|se me va|se le va) al brazo"
      # added 2026-11-21 after the external-set evaluation (voice/eval/proposed_rules.yaml)
      - "(duele|dolor\\w*|aprieta|oprime|opresion|arde|piquete|aplast\\w*)\\b.{0,30}\\bpe(ch|x)o"
      - "pecho.{0,40}(brazo|quijada|mandibula)"
      - "aplastando el corazon"
      - "agarr\\w* el pecho"
  unconscious:
    label_es: Pérdida de la conciencia
    patterns:
      - "desmay"
      - "perdio el (conocimiento|sentido)"
      - "no (responde|reacciona|despierta)"
      - "se privo"
      - "inconsciente"
      # added 2026-11-21 after the external-set evaluation (voice/eval/proposed_rules.yaml)
      - "no (me |nos )?(contesta|abre los ojos)"
      - "ojos en blanco"
      - "se le fue el sentido"
      - "se quedo ties"
      - "se le cierran los ojos"
  stroke_signs:
    label_es: Signos de embolia
    patterns:
      - "(cayo|chueca|torcida|caida).{0,15}(la cara|la boca)"
      - "no (puede|puedo) mover (el|la|un|una) (brazo|pierna|lado|mano)"
      - "habla (raro|arrastrado|trabado)"
      - "no se le entiende"
      # added 2026-11-21 after the external-set evaluation (voice/eval/proposed_rules.yaml)
      - "(chue\\w*|torci\\w*|caid\\w*|jal\\w*).{0,20}(la cara|la boca)"
      - "(la cara|la boca).{0,25}(chue|torci|caid|jalad)"
      - "habla como borracho"
      - "se le traba la lengua"
      - "se le (durmio|adormecio) (todo )?(el|un) lado"
      - "no (puede|puedo) (levantar|mover) (el|la) (brazo|pierna|mano)"
      - "no mueve (la|el) (mano|brazo|pierna)"
      - "dejo de hablar"
  seizure:
    label_es: Convulsiones
    patterns:
      - "convulsion"
      - "(dio|esta dando) un ataque"
      - "se (sacudia|sacude)"
      # added 2026-11-21 after the external-set evaluation (voice/eval/proposed_rules.yaml)
      - "espuma por la boca"
      - "temblando todo el cuerpo"
      - "se (estaba |esta )?sacudiendo"
  severe_bleeding:
    label_es: Sangrado abundante
    patterns:
      - "sangra (mucho|un buen|sin parar)"
      - "no (para|se para|deja) de sangrar"
      - "vomit\\w* sangre"
      # added 2026-11-21 after the external-set evaluation (voice/eval/proposed_rules.yaml)
      - "chorros? de sangre"
      - "sangre.{0,20}a chorros"
      - "sangra muchisimo"
      - "empap\\w*.{0,12}(toalla|trapo|ropa)"
      - "popo con sangre"
  serious_fall:
    label_es: Caída con golpe o que no puede levantarse
    patterns:
      - "(cayo|cai)\\b.{0,20}(pego|pegue|golpeo|golpee).{0,12}cabeza"
      - "(cayo|cai)\\b.{0,20}no (se |me )?(puede|puedo) (levantar|parar)"
      - "no (se puede|me puedo) levantar del piso"
      # added 2026-11-21 after the external-set evaluation (voice/eval/proposed_rules.yaml)
      - "(pego|golpeo|ranazo).{0,30}cabeza"
      - "(cayo|cai|resbalo).{0,45}no (se )?(puede|puedo) (parar|levantar|mover)"
      - "pierna (bien )?chueca"
      - "(encontre|esta) (tirad[oa] )?en el piso"
      - "sangre de la cabeza"
  sudden_confusion:
    label_es: Confusión súbita grave
    patterns:
      - "de repente.{0,30}no (me |nos )?(sabe|reconoce)"
      - "no me reconoce"
      - "no sabe (donde|quien) (esta|es)"
      - "desorientad[oa] de repente"
      # added 2026-11-21 after the external-set evaluation (voice/eval/proposed_rules.yaml)
      - "(de golpe|de repente|de pronto).{0,30}(confund|incoheren|no sabe)"
  self_harm:
    label_es: Intención de hacerse daño
    patterns:
      - "(quiero|quiere) (matarme|matarse|morir|morirme)"
      - "me quiero (matar|morir)"
      - "se quiere (matar|morir)"
      - "quit(ar|arse|arme|arle) la vida"
      - "(no quiero|no quiere|ni) vivir"
      - "(hacerme|hacerse) dano"
      # added 2026-11-21 after the external-set evaluation (voice/eval/proposed_rules.yaml)
      - "(tomar|tomo|tomarse) (todas las|un monton de) pastillas"
      - "ya no quiere seguir (aqui|viviendo)"

# Safety policy: rules favor sensitivity. There is NO negation handling here on purpose
# ("ya no puede respirar" and "ya no quiero vivir" are emergencies). A false alarm is acceptable;
# a missed emergency is not. The TensorFlow classifier may UPGRADE a message to emergency,
# but it can never downgrade a rule match.
classifier_can_downgrade_rule_match: false
