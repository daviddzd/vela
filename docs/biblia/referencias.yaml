# Referencias de La biblia de Enlaza, en formato APA 7. build.py las ordena y las imprime en el anexo «Referencias».
# Cada entrada: apa (texto APA 7 en Markdown), urls (para comprobar que toda URL de data/business/assumptions.csv tiene
# su referencia) y cita (apellido o nombre corto con que se cita en el texto, para comprobar que cada cita del libro
# tiene referencia). Los datos de artículos se verificaron en Crossref (25 nov 2026).
# {autores_equipo} se llena con los nombres de equipo.yaml (local, no se sube a Git): aquí no van nombres reales.

